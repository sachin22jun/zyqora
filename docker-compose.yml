services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zyqora
      POSTGRES_USER: zyqora
      POSTGRES_PASSWORD: zyqora
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./apps/api
    command: python -m app.worker
    env_file: .env
    depends_on: [db, redis]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
